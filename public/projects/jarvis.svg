<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="jarvisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FF3300" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hudLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF5500" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="#0A0A0A"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Glowing Core -->
  <circle cx="400" cy="250" r="180" fill="url(#jarvisGlow)"/>
  <circle cx="400" cy="250" r="110" fill="none" stroke="#FF5500" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="400" cy="250" r="85" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="14 10" opacity="0.4"/>
  <circle cx="400" cy="250" r="55" fill="#141414" stroke="#FF5500" stroke-width="2"/>
  <circle cx="400" cy="250" r="18" fill="#FF5500"/>

  <!-- Waveforms -->
  <g stroke="#FF5500" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="280" y1="250" x2="280" y2="230"/>
    <line x1="300" y1="250" x2="300" y2="215"/>
    <line x1="320" y1="250" x2="320" y2="200"/>
    <line x1="340" y1="250" x2="340" y2="225"/>
    <line x1="460" y1="250" x2="460" y2="225"/>
    <line x1="480" y1="250" x2="480" y2="200"/>
    <line x1="500" y1="250" x2="500" y2="215"/>
    <line x1="520" y1="250" x2="520" y2="230"/>
  </g>

  <!-- HUD Telemetry Headers -->
  <text x="40" y="55" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">SYSTEM://JARVIS_VOICE_CORE_ONLINE</text>
  <circle cx="340" cy="51" r="4" fill="#00FF66"/>
  
  <rect x="40" y="75" width="160" height="28" rx="4" fill="#171717" stroke="#262626"/>
  <text x="52" y="93" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INPUT: VOICE_DETECT</text>

  <rect x="600" y="420" width="160" height="32" rx="4" fill="#171717" stroke="#FF5500" stroke-opacity="0.4"/>
  <text x="618" y="441" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">STATE: ACTIVE LISTENING</text>

  <text x="400" y="440" fill="#E4E4E7" font-family="'Syne', sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="3">AI ASSISTANT AGENT</text>
  <line x1="240" y1="460" x2="560" y2="460" stroke="url(#hudLine)" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#050505"/>
  
  <!-- Brutalist Frame -->
  <rect x="25" y="25" width="750" height="450" fill="#0C0C0C" stroke="#262626" stroke-width="1.5"/>
  
  <!-- Mini browser bar -->
  <rect x="25" y="25" width="750" height="42" fill="#141414" stroke="#262626" stroke-width="1.5"/>
  <circle cx="50" cy="46" r="5" fill="#FF5F56"/>
  <circle cx="68" cy="46" r="5" fill="#FFBD2E"/>
  <circle cx="86" cy="46" r="5" fill="#27C93F"/>
  <rect x="250" y="34" width="300" height="24" rx="12" fill="#1F1F1F"/>
  <text x="400" y="50" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">https://shiva-portfolio.dev</text>
  
  <!-- Massive Typography in preview -->
  <g opacity="0.9">
    <text x="50" y="180" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="82" font-weight="900" letter-spacing="-3">KARLAPUDI</text>
    <text x="50" y="260" fill="#262626" font-family="'Syne', sans-serif" font-size="82" font-weight="900" letter-spacing="-3">SHIVAPRASAD</text>
  </g>
  
  <rect x="50" y="290" width="180" height="4" fill="#FF4D00"/>
  <text x="50" y="330" fill="#FF4D00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">ASPIRING AI &amp; SOFTWARE DEVELOPER</text>
  <text x="50" y="360" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Curious by nature. Builder by choice. TKR College of Engineering.</text>
  
  <!-- Interactive Pill Tag -->
  <rect x="50" y="395" width="130" height="34" rx="17" fill="#FF4D00"/>
  <text x="115" y="417" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">EXPLORE WORK →</text>
  
  <!-- Right decorative stamp -->
  <rect x="630" y="330" width="110" height="110" fill="none" stroke="#FF4D00" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="685" cy="385" r="40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <text x="685" y="382" fill="#FF4D00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">SHIVA</text>
  <text x="685" y="398" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">2026 ED.</text>
</svg>
